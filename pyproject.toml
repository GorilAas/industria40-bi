[project]
name = "industria40-bi"
version = "0.1.0"
description = "Painel gerencial Indústria 4.0 (Streamlit + Pandas + Supabase)"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.40",
    "streamlit-autorefresh>=1.0.1",
    "pandas>=2.2",
    "plotly>=5.24",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM108"]
